services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
    command: ["sh", "-lc", "bundle check || bundle install; bin/rails db:migrate && bin/rails server -b 0.0.0.0"]

volumes:
  bundle_cache:
